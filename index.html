<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Life 투자관리</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div id="app">
    <!-- 헤더 -->
    <header class="app-header">
      <h1 class="app-title">My Life 투자관리</h1>
      <div class="session-info" id="sessionInfo"></div>
    </header>

    <!-- 네비게이션 탭 -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="invest">투자 입력</button>
      <button class="tab-btn" data-tab="records">전체 내역</button>
      <button class="tab-btn" data-tab="search">참가자 검색</button>
      <button class="tab-btn" data-tab="products">상품 설정</button>
      <button class="tab-btn" data-tab="settings">세션/백업</button>
    </nav>

    <!-- 탭 콘텐츠 -->
    <main class="tab-content">
      <!-- 투자 입력 화면 -->
      <section id="tab-invest" class="tab-panel active"></section>

      <!-- 전체 투자내역 화면 -->
      <section id="tab-records" class="tab-panel"></section>

      <!-- 참가자 검색 화면 -->
      <section id="tab-search" class="tab-panel"></section>

      <!-- 상품 설정 화면 -->
      <section id="tab-products" class="tab-panel"></section>

      <!-- 세션/백업 화면 -->
      <section id="tab-settings" class="tab-panel"></section>
    </main>
  </div>

  <!-- 토스트 메시지 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 확인 모달 -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-content">
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmYes" class="btn btn-danger">확인</button>
        <button id="confirmNo" class="btn btn-secondary">취소</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui-invest.js"></script>
  <script src="js/ui-records.js"></script>
  <script src="js/ui-search.js"></script>
  <script src="js/ui-products.js"></script>
  <script src="js/ui-settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/test-verify.js"></script>
</body>
</html>
