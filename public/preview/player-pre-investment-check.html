<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Life · 투자 전 안내 샘플</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="../js/tailwind-config.js"></script>
  <style>
    body { font-family: 'Hanken Grotesk', system-ui, sans-serif; background: #e9edf3; }
    .custom-input { height: 48px; width: 100%; border: 1px solid #E5E8EB; border-radius: 12px; background: #F5F6F8; padding: 0 14px; font-size: 15px; }
    .custom-input:focus { outline: none; border-color: #8B5CF6; background: #fff; box-shadow: 0 0 0 4px rgba(139,92,246,.12); }
    .mode-switch button[aria-pressed="true"] { background: #fff; color: #4e2bb8; box-shadow: 0 1px 3px rgba(0,0,0,.10); }
  </style>
</head>
<body class="min-h-screen text-on-surface antialiased">
  <div class="mx-auto min-h-screen max-w-[390px] bg-background shadow-xl">
    <header class="sticky top-0 z-20 flex h-14 items-center justify-between bg-brand-blue px-4 shadow-sm">
      <div class="flex items-center gap-2"><img src="../logo.png" alt="" width="28" height="28" class="rounded-md bg-white/90 p-0.5"><h1 class="text-[17px] font-bold text-white">My Life</h1></div>
      <span class="text-[14px] font-medium text-white">김민지 · 1조</span>
    </header>
    <section class="bg-white px-4 py-3 shadow-sm">
      <div class="mb-2 flex items-center justify-between"><span class="text-[13px] font-bold">턴 <span id="turnNumber">4</span> <span class="font-normal text-brand-gray-text">/ 20</span></span><span class="text-[12px] text-brand-gray-text">투자 접수 중</span></div>
      <div class="h-1.5 overflow-hidden rounded-full bg-surface-container"><div id="progressBar" class="h-full w-1/5 rounded-full bg-brand-blue"></div></div>
    </section>

    <main class="space-y-4 p-4 pb-10">
      <section class="rounded-2xl bg-brand-blue/5 border border-brand-blue/15 p-4 flex items-center gap-3">
        <span class="text-[22px]">👉</span><p class="text-[14px] leading-5 text-brand-gray-dark">투자할 상품을 고르거나, 이번 턴 투자 안 함을 선택하세요.</p>
      </section>
      <section class="rounded-2xl bg-white p-4 shadow-card">
        <h2 class="mb-3 text-[16px] font-bold">투자할 상품을 선택하세요</h2>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="h-[180px] rounded-xl border-2 border-transparent bg-white p-4 text-left shadow-card flex flex-col justify-between"><div><h3 class="text-[15px] font-bold">채권형펀드</h3><p class="mt-1 text-[12px] text-on-surface-variant">안정적인 수익을 추구해요</p></div><div><span class="rounded-full bg-brand-green-light px-2 py-0.5 text-[11px] font-bold text-brand-green">+4%</span><p class="mt-2 text-[10px] text-on-surface-variant">성공 <b class="text-brand-green">1,2,3,5,6</b> · 보존 <b class="text-brand-purple">4</b></p><p class="mt-2 border-t border-surface-variant pt-2 text-[11px] text-outline">최소 500만 원</p></div></button>
          <button type="button" class="h-[180px] rounded-xl border-2 border-transparent bg-white p-4 text-left shadow-card flex flex-col justify-between"><div><h3 class="text-[15px] font-bold">주식형펀드</h3><p class="mt-1 text-[12px] text-on-surface-variant">성장 가능성을 함께 봐요</p></div><div><span class="rounded-full bg-brand-green-light px-2 py-0.5 text-[11px] font-bold text-brand-green">+8%</span> <span class="rounded-full bg-brand-red-light px-2 py-0.5 text-[11px] font-bold text-brand-red">-20%</span><p class="mt-2 text-[10px] text-on-surface-variant">성공 <b class="text-brand-green">1,2,3,6</b> · 보존 <b class="text-brand-purple">4</b></p><p class="mt-2 border-t border-surface-variant pt-2 text-[11px] text-outline">최소 500만 원</p></div></button>
          <button type="button" class="h-[180px] rounded-xl border-2 border-transparent bg-white p-4 text-left shadow-card flex flex-col justify-between"><div><h3 class="text-[15px] font-bold">고위험ETF</h3><p class="mt-1 text-[12px] text-on-surface-variant">큰 폭의 변동을 감수해요</p></div><div><span class="rounded-full bg-brand-green-light px-2 py-0.5 text-[11px] font-bold text-brand-green">+20%</span> <span class="rounded-full bg-brand-red-light px-2 py-0.5 text-[11px] font-bold text-brand-red">-50%</span><p class="mt-2 text-[10px] text-on-surface-variant">성공 <b class="text-brand-green">1,2,3,4</b> · 보존 <b class="text-brand-purple">5</b></p><p class="mt-2 border-t border-surface-variant pt-2 text-[11px] text-outline">최소 500만 원</p></div></button>
          <button type="button" class="h-[180px] rounded-xl border-2 border-transparent bg-white p-4 text-left shadow-card flex flex-col justify-between"><div><h3 class="text-[15px] font-bold">선물/옵션</h3><p class="mt-1 text-[12px] text-on-surface-variant">높은 위험과 수익을 함께 봐요</p></div><div><span class="rounded-full bg-brand-green-light px-2 py-0.5 text-[11px] font-bold text-brand-green">+30%</span> <span class="rounded-full bg-brand-red-light px-2 py-0.5 text-[11px] font-bold text-brand-red">-60%</span><p class="mt-2 text-[10px] text-on-surface-variant">성공 <b class="text-brand-green">1,2,3</b> · 보존 <b class="text-brand-purple">4</b></p><p class="mt-2 border-t border-surface-variant pt-2 text-[11px] text-outline">최소 500만 원</p></div></button>
        </div>
        <button type="button" class="mt-3 h-11 w-full rounded-xl bg-brand-gray-light text-[15px] font-medium text-brand-gray-dark">이번 턴 투자 안 함</button>
      </section>
    </main>
  </div>

  <div id="notice" class="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
    <div class="absolute inset-0 bg-black/45"></div>
    <section class="relative w-full max-w-[390px] max-h-[88vh] overflow-y-auto rounded-t-2xl bg-white px-5 pb-7 pt-4 shadow-2xl">
      <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-brand-border"></div>
      <div class="mb-4 flex items-center justify-between gap-3">
        <div><p class="text-[13px] font-bold text-brand-blue">투자 전 순서</p><h2 id="noticeTitle" class="mt-1 text-[20px] font-bold">앞 단계를 마친 뒤 투자하세요</h2></div>
        <div class="mode-switch inline-flex rounded-xl bg-brand-purple-light p-1 text-[11px] font-bold text-brand-gray-dark" aria-label="샘플 상태 선택"><button type="button" data-mode="normal" aria-pressed="false" class="rounded-lg px-2 py-1.5">일반 턴</button><button type="button" data-mode="quarter" aria-pressed="true" class="rounded-lg px-2 py-1.5">4턴</button></div>
      </div>
      <ol class="mb-4 space-y-2.5 text-[13px]">
        <li class="flex items-center gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-gray-light text-[11px] font-bold text-brand-gray-dark">1</span>돈과 시간 수령</li>
        <li class="flex items-center gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-gray-light text-[11px] font-bold text-brand-gray-dark">2</span>버킷리스트 채우기</li>
        <li class="flex items-center gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-gray-light text-[11px] font-bold text-brand-gray-dark">3</span>업무능력 투자 결정</li>
        <li class="flex items-center gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-gray-light text-[11px] font-bold text-brand-gray-dark">4</span>버킷리스트 이룰지 결정</li>
        <li class="flex items-center gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-gray-light text-[11px] font-bold text-brand-gray-dark">5</span>버킷리스트 버릴 것 결정</li>
        <li class="flex items-center gap-3 font-bold text-brand-blue"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-blue text-[11px] font-bold text-white">6</span>상품 투자</li>
      </ol>
      <div id="quarterRecord" class="mb-4 rounded-xl border border-brand-purple/20 bg-brand-purple-light/50 p-4">
        <div class="flex items-center justify-between"><h3 class="text-[14px] font-bold">1년차 버킷 기록</h3><span class="text-[12px] font-bold text-brand-purple">현재 누적 3개 · 120점</span></div>
        <div class="mt-3 grid grid-cols-2 gap-2"><div><label for="bucketCount" class="mb-1.5 block text-[12px] font-medium text-brand-gray-dark">이번에 이룬 개수</label><input id="bucketCount" class="custom-input" type="number" min="0" inputmode="numeric" placeholder="0"></div><div><label for="bucketScore" class="mb-1.5 block text-[12px] font-medium text-brand-gray-dark">이번 버킷 점수</label><input id="bucketScore" class="custom-input" type="number" min="0" inputmode="numeric" placeholder="0"></div></div>
      </div>
      <button id="startInvesting" type="button" class="h-12 w-full rounded-xl bg-brand-blue text-[15px] font-bold text-white active:scale-[.98]">앞 단계 완료 · 투자 시작</button>
    </section>
  </div>

  <script>
    let mode = 'quarter';
    function setMode(nextMode) {
      mode = nextMode;
      const isQuarter = mode === 'quarter';
      document.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      document.getElementById('turnNumber').textContent = isQuarter ? '4' : '3';
      document.getElementById('progressBar').className = `h-full rounded-full bg-brand-blue ${isQuarter ? 'w-1/5' : 'w-[15%]'}`;
      document.getElementById('quarterRecord').classList.toggle('hidden', !isQuarter);
    }
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
    document.getElementById('startInvesting').addEventListener('click', () => document.getElementById('notice').classList.add('hidden'));
    setMode('quarter');
  </script>
</body>
</html>
