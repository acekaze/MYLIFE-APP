<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>버킷 사진 확인</title><style>body{font-family:Arial,sans-serif;background:#edf2f8}button{border:0;border-radius:14px;padding:16px;cursor:pointer}button:disabled{opacity:.4}section{padding:20px}</style><section id="gallery"></section><button id="open">사진으로 선택하기</button><p id="status">사진 UI 테스트 · 실제 게임 데이터는 변경하지 않습니다.</p><script src="/js/bucket-catalog.js"></script><script src="/player-v3/bucket-ui.js"></script><script>let cards=BUCKET_CATALOG.slice(0,5).map(c=>[c.title,c.cash,c.time,c.score,1,c.id]),used={},cash=1000,time=8;function open(){BucketUI.choose(cards,used,false,(kind,i)=>{if(used[kind])return;if(kind==='done'){if(cash<cards[i][1]||time<cards[i][2])return;cash-=cards[i][1];time-=cards[i][2];}used[kind]=true;cards.splice(i,1);open()},()=>document.getElementById('status').textContent='선택 완료',{cash,time})}BucketUI.gallery(document.getElementById('gallery'),cards,'보유 카드');document.getElementById('open').onclick=open;</script></html>
