<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진입 페이지 개선안</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/tailwind-config.js"></script>
  <style>
    body { font-family: 'Hanken Grotesk', sans-serif; background:#F5F6F8; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes fadeUp { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }
    .fadeup { animation: fadeUp 0.5s ease both; }
  </style>
</head>
<body class="min-h-screen">
  <!-- 비교 바 -->
  <div class="bg-brand-blue text-white text-center text-[13px] py-2">✨ 개선안 미리보기 · <a href="index.html" class="underline">← 목록으로</a></div>

  <div class="min-h-[calc(100vh-36px)] flex flex-col items-center justify-center p-6">
    <main class="w-full max-w-[360px] flex flex-col items-center text-center">
      <!-- 시각 앵커 -->
      <div class="float mb-6">
        <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-brand-blue to-blue-600 flex items-center justify-center text-[40px] shadow-lg shadow-blue-200">
          🎲
        </div>
      </div>

      <!-- 타이틀 -->
      <h1 class="text-[32px] font-bold text-on-surface fadeup" style="animation-delay:0.05s">My Life</h1>
      <p class="text-[15px] text-brand-gray-text mt-1 fadeup" style="animation-delay:0.1s">투자 보드게임</p>

      <!-- 한 줄 설명 -->
      <p class="text-[14px] text-on-surface-variant mt-4 leading-relaxed fadeup" style="animation-delay:0.15s">
        직장 1년차의 5년.<br>
        나만의 기준으로 자산을 굴리고<br>
        원하는 삶을 설계해보세요.
      </p>

      <!-- 역할 선택 -->
      <div class="flex flex-col gap-3 w-full mt-8">
        <a href="#" class="w-full h-[56px] bg-brand-blue text-white rounded-2xl font-bold text-[16px] flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-md shadow-blue-100 fadeup" style="animation-delay:0.2s">
          <span class="text-[20px]">📱</span> 참가자 입장
        </a>
        <a href="#" class="w-full h-[52px] bg-white text-on-surface border border-outline-variant rounded-2xl font-bold text-[15px] flex items-center justify-center gap-2 hover:bg-surface-container-low active:scale-[0.98] transition-all fadeup" style="animation-delay:0.25s">
          <span class="text-[18px]">🎯</span> 관리자
        </a>
      </div>

      <!-- 하단 안내 -->
      <div class="mt-8 flex items-center gap-2 text-[12px] text-brand-gray-text fadeup" style="animation-delay:0.3s">
        <span class="w-1.5 h-1.5 rounded-full bg-brand-green"></span>
        참가자는 진행자가 안내한 QR 또는 코드로 입장하세요
      </div>

      <footer class="mt-10">
        <p class="text-[12px] text-outline-variant">© My Life 투자 보드게임</p>
      </footer>
    </main>
  </div>
</body>
</html>
