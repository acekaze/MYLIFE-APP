<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연봉협상 팝업 테스트</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:#edf2f8;padding:24px}button{border:0;border-radius:12px;background:#327cf0;color:white;padding:16px;cursor:pointer}button:disabled{opacity:.5}</style><h1 id="title">연봉협상</h1><p>테스트 화면 · 실제 게임 기록은 변경하지 않습니다.</p><div id="content"></div><button onclick="location.reload()">다시 체험</button><script src="/js/salary-roulette.js"></script><script>
const el=id=>document.getElementById(id),c=el('content');let closingTurn=4,busy=false,negotiations={};window.abilityCount=3;
const root={child:()=>({set:async()=>{}})};
function render(){el('negotiationPopup')?.remove();negotiationScreen();}
async function rollNegotiation(){if(busy||negotiations[4])return;busy=true;const dice=SalaryRoulette.randomFace(),bonus=2,total=dice+bonus,raise=total<=2?0:total<=4?1:total<=6?2:3;await SalaryRoulette.spin(el('salaryWheel'),dice);negotiations[4]={status:'settled',ability:3,dice,bonus,total,before:6,after:6+raise,effectiveTurn:5};busy=false;render();}
function negotiationScreen(){
 const record=negotiations[closingTurn];const r=record?.status==='settled'?record:null;
 el('title').textContent='Q'+closingTurn+' 종료 · 연봉협상';
 c.innerHTML='<h2>연봉협상</h2><p>업무능력 투자 '+(window.abilityCount||0)+'칸 · 보정 +'+Math.max(0,(window.abilityCount||0)-1)+'</p>'+(r?'<h3>'+(r.ability?'룰렛 '+r.dice+' + 보정 '+r.bonus+' = '+r.total:'업무능력 투자 0칸 · 협상 없이 동결')+'</h3><p>연봉 '+r.before+' → '+r.after+'단계 · Q'+r.effectiveTurn+'부터 적용</p><p>업무능력 투자 칸 반납 완료</p>':'<button id="rollNegotiation">'+((window.abilityCount||0)?'룰렛 돌리기':'동결 확인')+'</button>');
 if(r?.acknowledged)return;
 const popup=document.createElement('div');popup.id='negotiationPopup';popup.setAttribute('role','dialog');popup.setAttribute('aria-modal','true');popup.setAttribute('aria-label','연봉협상');
 popup.style.cssText='position:fixed;inset:0;z-index:1100;background:#102238f5;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto';
 popup.innerHTML='<section style="width:min(560px,100%);background:white;color:#17243d;border-radius:24px;padding:32px;text-align:center;font-size:20px">'+c.innerHTML+(r?'<button id="confirmNegotiation" style="width:100%;padding:20px">결과 확인 · 마감 완료</button>':'')+'</section>';
 c.innerHTML='<h2>분기 마감</h2><p>연봉협상을 진행하세요.</p>';document.body.append(popup);SalaryRoulette.decorate(popup,r,closingTurn);
 if(!r&&(window.abilityCount||0)>0){const wheel=document.createElement('div');wheel.id='salaryWheel';el('rollNegotiation').before(wheel);SalaryRoulette.mount(wheel);}
 if(!r){el('rollNegotiation').disabled=busy;el('rollNegotiation').onclick=()=>{SalaryRoulette.unlock();el('rollNegotiation').disabled=true;rollNegotiation();};}
 else el('confirmNegotiation').onclick=async()=>{const period=closingTurn;el('confirmNegotiation').disabled=true;try{await root.child('negotiations/'+period+'/acknowledged').set(true);negotiations[period].acknowledged=true;render();}catch(e){el('confirmNegotiation').disabled=false;}};

}

render();
</script></html>
