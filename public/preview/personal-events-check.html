<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인 이벤트 32장 확인</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f0f4f1;color:#173342;max-width:880px;margin:30px auto;padding:20px}button,select{padding:14px;border:1px solid #bacac4;border-radius:12px;background:white;color:#173342;font:inherit;margin:5px}button:disabled{opacity:.4}#summary{background:white;border-radius:16px;padding:20px;margin:20px 0}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}img{max-width:100%}#grid button{font-size:12px;text-align:left}#grid img{border-radius:10px}label{display:block}small{color:#687d81}</style><h1>개인 이벤트 · 전체 32장</h1><p>실제 PDF의 개인 이벤트 전체 목록입니다. 게임 데이터는 변경하지 않습니다.</p><p>21장 고정 효과 · 6장 연봉 구간형 · 2장 팀 전체 · 2장 선택형 · 1장 버킷 교체</p><label>현재 연봉 단계 <select id="level"><option value="2">2단계</option><option value="6" selected>6단계</option><option value="10">10단계</option></select></label><button id="random">무작위 카드 공개</button><button id="repay">다음 턴 수령 체험 (+850만·시간 4)</button><div id="summary"></div><div id="grid"></div><script src="/js/bucket-catalog.js"></script><script src="/js/personal-event-catalog.js"></script><script src="/js/personal-event-engine.js"></script><script>
let data;function reset(id){data={gameVersion:'integrated-v3',state:{currentTurn:2,phase:'investing'},players:{a:{name:'나',teamId:'one'},b:{name:'팀원',teamId:'one'}},integrated:{a:{cash:100,time:1,score:0,salaryLevel:Number(document.getElementById('level').value),hand:BUCKET_CATALOG.slice(0,5).map(c=>[c.title,c.cash,c.time,c.score,1,c.id]),eventDraws:id?{2:{cardId:id,status:'revealed'}}:{}},b:{cash:100,time:1,score:0,salaryLevel:6}}};}
window.firebase={database:()=>({ref:()=>({once:async()=>({val:()=>data}),transaction:async change=>{const next=change(structuredClone(data));if(next)data=next;return {committed:!!next,snapshot:{val:()=>data}};}})})};
</script><script src="/player-v3/personal-event-ui.js"></script><script>
function summary(){const p=data.integrated.a,b=data.integrated.b;document.getElementById('summary').textContent='나: 현금 '+p.cash+'만 · 시간 '+p.time+'개 · 만족도 '+p.score+'점 / 팀원 현금 '+b.cash+'만 / 미납 '+Object.values(p.eventDebts||{}).reduce((n,d)=>n+d.cash,0)+'만 · 시간 '+Object.values(p.eventDebts||{}).reduce((n,d)=>n+d.time,0)+'개';}
function show(){const p=data.integrated.a;PersonalEventUI.show({sid:'DEMO',pid:'a',turn:2,record:p.eventDraws[2],resources:p,onRefresh:()=>{summary();show();},onDone:()=>{document.getElementById('personalEventPopup')?.remove();summary();}});}
const grid=document.getElementById('grid');for(const card of PERSONAL_EVENTS){const button=document.createElement('button');const img=document.createElement('img');img.src=card.image;img.loading='lazy';img.alt=card.title;button.append(img);const title=document.createElement('p');title.textContent=card.title+(card.college?' · 대학생':'');button.append(title);button.onclick=()=>{reset(card.id);summary();show();};grid.append(button);}
document.getElementById('random').onclick=()=>{reset();summary();show();};document.getElementById('repay').onclick=()=>{const p=data.integrated.a;p.cash+=850;p.time+=4;PersonalEventEngine.payDebts(p,3);summary();};reset();summary();
</script></html>
