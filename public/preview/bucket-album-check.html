<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이룬 버킷 앨범</title><style>body{font-family:Arial,sans-serif;background:#edf2f8;color:#17243d;max-width:960px;margin:auto;padding:20px}button{border:0;border-radius:14px;padding:16px;cursor:pointer}section{padding:20px;background:white;border-radius:18px}</style><h1>이룬 버킷 · 공유와 앨범</h1><button id="q4">Q4 마감</button><button id="q5">Q5 시작</button><section id="album"></section><script src="/js/bucket-catalog.js"></script><script src="/player-v3/bucket-ui.js"></script><script>const cards=BUCKET_CATALOG.slice(0,3).map((c,i)=>[c.title,c.cash,c.time,c.score,1,c.id,i+1]);const target=document.getElementById('album');document.getElementById('q4').onclick=()=>BucketUI.album(target,cards,4,true);document.getElementById('q5').onclick=()=>BucketUI.album(target,cards,5,false);BucketUI.album(target,cards,4,true);</script></html>
