<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참가자 현황 개선안</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/tailwind-config.js"></script>
  <style>
    body { font-family: 'Hanken Grotesk', sans-serif; background:#F5F6F8; }
    @keyframes countUp { from{opacity:0; transform:scale(0.9)} to{opacity:1; transform:scale(1)} }
    .countup { animation: countUp 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
  </style>
</head>
<body class="min-h-screen">
  <div class="bg-brand-blue text-white text-center text-[13px] py-2">✨ 개선안 미리보기 · <a href="index.html" class="underline">← 목록으로</a></div>

  <div class="w-full max-w-[390px] mx-auto min-h-screen bg-background">
    <!-- Header -->
    <header class="sticky top-0 w-full z-50 bg-brand-blue h-[56px] flex items-center justify-between px-4 shadow-sm">
      <h1 class="text-white font-bold text-[17px]">My Life 투자</h1>
      <span class="text-white font-medium text-[14px]">홍길동 · 1조</span>
    </header>

    <!-- 진행률 바 (신규) -->
    <div class="bg-white px-4 py-3 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[13px] font-bold text-on-surface">턴 5 <span class="text-brand-gray-text font-normal">/ 20</span></span>
        <span class="text-[12px] text-brand-gray-text">투자 접수 중</span>
      </div>
      <div class="h-1.5 bg-surface-container rounded-full overflow-hidden">
        <div class="h-full bg-brand-blue rounded-full transition-all" style="width:25%"></div>
      </div>
    </div>

    <main class="p-4 pb-20 space-y-4">
      <!-- 순수익 히어로 (신규 · 최상단 큰 숫자) -->
      <div class="bg-gradient-to-br from-white to-blue-50 rounded-2xl p-6 shadow-card text-center countup">
        <div class="text-[13px] text-brand-gray-text mb-1">내 순수익</div>
        <div class="text-[44px] font-bold text-brand-green leading-none">+700<span class="text-[18px] text-brand-gray-text font-medium ml-1">만 원</span></div>
        <div class="flex justify-center gap-4 mt-4 pt-4 border-t border-brand-gray-light/60">
          <div>
            <div class="text-[16px] font-bold text-brand-green">+1,200</div>
            <div class="text-[11px] text-brand-gray-text">총 수익</div>
          </div>
          <div class="w-px bg-brand-gray-light"></div>
          <div>
            <div class="text-[16px] font-bold text-brand-red">-500</div>
            <div class="text-[11px] text-brand-gray-text">총 손실</div>
          </div>
          <div class="w-px bg-brand-gray-light"></div>
          <div>
            <div class="text-[16px] font-bold text-on-surface">5</div>
            <div class="text-[11px] text-brand-gray-text">투자 횟수</div>
          </div>
        </div>
      </div>

      <!-- 지금 할 일 안내 (신규) -->
      <div class="bg-brand-blue/5 border border-brand-blue/15 rounded-2xl p-4 flex items-center gap-3">
        <span class="text-[22px]">👉</span>
        <div>
          <div class="font-bold text-[14px] text-brand-blue">이번 턴, 투자할 상품을 골라보세요</div>
          <div class="text-[12px] text-brand-gray-text mt-0.5">최소 500만 원부터 · 여러 번 투자 가능</div>
        </div>
      </div>

      <!-- 상품 카드 (기존 유지, 그림자 위계만 예시) -->
      <div class="bg-white rounded-2xl p-4 shadow-card">
        <h2 class="font-bold text-[15px] mb-3">투자 상품</h2>
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-xl p-4 border-2 border-brand-blue bg-blue-50 h-[150px] flex flex-col justify-between">
            <div>
              <div class="font-bold text-[15px]">주식형펀드</div>
              <div class="text-[12px] text-brand-gray-text mt-1">중위험 중수익</div>
            </div>
            <div>
              <div class="flex gap-1 mb-2">
                <span class="bg-brand-green-light text-brand-green text-[11px] font-bold px-2 py-0.5 rounded-full">+16%</span>
                <span class="bg-brand-red-light text-brand-red text-[11px] font-bold px-2 py-0.5 rounded-full">-20%</span>
              </div>
              <div class="text-[10px] text-on-surface-variant">성공 <span class="text-brand-green font-bold">1,2,3,6</span></div>
            </div>
          </div>
          <div class="rounded-xl p-4 border-2 border-transparent bg-white shadow-card h-[150px] flex flex-col justify-between">
            <div>
              <div class="font-bold text-[15px]">채권형펀드</div>
              <div class="text-[12px] text-brand-gray-text mt-1">안정적 수익</div>
            </div>
            <div>
              <div class="flex gap-1 mb-2">
                <span class="bg-brand-green-light text-brand-green text-[11px] font-bold px-2 py-0.5 rounded-full">+8%</span>
              </div>
              <div class="text-[10px] text-on-surface-variant">성공 <span class="text-brand-green font-bold">1,2,3,5,6</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 진행 중인 투자 -->
      <div class="bg-white rounded-2xl p-5 shadow-card">
        <h2 class="font-bold text-[15px] mb-3">📊 진행 중인 투자</h2>
        <div class="flex justify-between items-center py-2">
          <div>
            <div class="font-bold text-[14px]">고위험ETF</div>
            <div class="text-[12px] text-brand-gray-text">턴 3 → 턴 7 만기</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-[14px]">2,000만 원</div>
            <div class="text-[12px] text-brand-orange">만기까지 2턴</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
