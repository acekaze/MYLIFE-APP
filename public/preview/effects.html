<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연출 미리보기</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../js/tailwind-config.js"></script>
  <style>
    body { font-family: 'Hanken Grotesk', sans-serif; background:#F5F6F8; }

    /* 성공 축하: 색종이 */
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
    }
    /* 성공 배지 팝 */
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }

    /* 턴 전환 */
    @keyframes turnSlide {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); }
      20% { opacity: 1; transform: scale(1) translateY(0); }
      80% { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(1.1) translateY(-10px); }
    }
    .turn-slide { animation: turnSlide 2s ease both; }

    /* 게임 종료 페이드 */
    @keyframes gmeFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ge-item { animation: gmeFade 0.6s ease both; }
  </style>
</head>
<body class="min-h-screen">
  <div class="bg-brand-blue text-white text-center text-[13px] py-2">✨ 연출 미리보기 · 버튼을 눌러 재생하세요</div>

  <div class="max-w-[420px] mx-auto p-5 space-y-4">
    <!-- 1. 성공 축하 -->
    <div class="bg-white rounded-2xl p-6 shadow-card">
      <h2 class="font-bold text-[16px] mb-1">1. 투자 성공 축하 연출</h2>
      <p class="text-brand-gray-text text-[13px] mb-4">주사위 성공 시 색종이 + 배지 팝업</p>
      <button onclick="playSuccess()" class="w-full h-[48px] bg-brand-green text-white rounded-xl font-bold active:scale-[0.98] transition-transform">▶ 성공 연출 재생</button>
    </div>

    <!-- 2. 턴 전환 -->
    <div class="bg-white rounded-2xl p-6 shadow-card">
      <h2 class="font-bold text-[16px] mb-1">2. 턴 전환 애니메이션</h2>
      <p class="text-brand-gray-text text-[13px] mb-4">다음 턴 시작 시 "턴 6" 오버레이</p>
      <button onclick="playTurn()" class="w-full h-[48px] bg-brand-blue text-white rounded-xl font-bold active:scale-[0.98] transition-transform">▶ 턴 전환 재생</button>
    </div>

    <!-- 3. 게임 종료 -->
    <div class="bg-white rounded-2xl p-6 shadow-card">
      <h2 class="font-bold text-[16px] mb-1">3. 게임 종료 마무리 연출</h2>
      <p class="text-brand-gray-text text-[13px] mb-4">"당신의 5년" 요약 순차 등장</p>
      <button onclick="playGameEnd()" class="w-full h-[48px] bg-inverse-surface text-white rounded-xl font-bold active:scale-[0.98] transition-transform">▶ 종료 연출 재생</button>
    </div>

    <p class="text-center text-brand-gray-text text-[12px] mt-6">마음에 드는 것을 알려주면 실제 앱에 반영합니다</p>
  </div>

  <!-- 오버레이 컨테이너 -->
  <div id="overlay"></div>

  <script>
    const colors = ['#3182F6','#00C48C','#FF9F0A','#FF4D4D','#8B5CF6','#FFD700'];

    function playSuccess() {
      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <div style="position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; pointer-events:none;">
          <div class="pop-in" style="background:white; border-radius:24px; padding:32px 40px; box-shadow:0 12px 40px rgba(0,0,0,0.2); text-align:center;">
            <div style="font-size:56px;">🎉</div>
            <div style="font-size:22px; font-weight:700; color:#00C48C; margin-top:8px;">투자 성공!</div>
            <div style="font-size:28px; font-weight:700; color:#00C48C; margin-top:4px;">+320만 원</div>
          </div>
        </div>
      `;
      // 색종이
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('div');
        const size = 6 + Math.random() * 8;
        c.style.cssText = `position:fixed; z-index:9998; top:-20px; left:${Math.random()*100}vw;
          width:${size}px; height:${size}px; background:${colors[i%colors.length]};
          border-radius:${Math.random()>0.5?'50%':'2px'}; pointer-events:none;
          animation: confettiFall ${1+Math.random()*1.5}s ease-in ${Math.random()*0.5}s forwards;`;
        ov.appendChild(c);
      }
      setTimeout(() => ov.innerHTML = '', 2500);
    }

    function playTurn() {
      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <div style="position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(49,130,246,0.92); pointer-events:none;">
          <div class="turn-slide" style="text-align:center; color:white;">
            <div style="font-size:15px; opacity:0.85;">다음 분기</div>
            <div style="font-size:64px; font-weight:700; line-height:1;">턴 6</div>
            <div style="font-size:14px; opacity:0.85; margin-top:8px;">새로운 투자를 시작하세요</div>
          </div>
        </div>
      `;
      setTimeout(() => ov.innerHTML = '', 2000);
    }

    function playGameEnd() {
      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <div style="position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(27,29,31,0.96); padding:24px;">
          <div style="text-align:center; color:white; max-width:320px; width:100%;">
            <div class="ge-item" style="font-size:48px; animation-delay:0s;">🏁</div>
            <div class="ge-item" style="font-size:24px; font-weight:700; margin-top:8px; animation-delay:0.2s;">당신의 5년</div>
            <div class="ge-item" style="font-size:14px; opacity:0.7; margin-top:4px; animation-delay:0.4s;">20턴의 여정이 끝났습니다</div>
            <div class="ge-item" style="background:rgba(255,255,255,0.1); border-radius:16px; padding:20px; margin-top:24px; animation-delay:0.7s;">
              <div style="font-size:13px; opacity:0.7;">최종 순수익</div>
              <div style="font-size:40px; font-weight:700; color:#00C48C;">+700<span style="font-size:16px; opacity:0.7;"> 만원</span></div>
              <div style="display:flex; justify-content:space-around; margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.15);">
                <div><div style="font-size:18px; font-weight:700;">5</div><div style="font-size:11px; opacity:0.6;">투자</div></div>
                <div><div style="font-size:18px; font-weight:700; color:#00C48C;">3</div><div style="font-size:11px; opacity:0.6;">성공</div></div>
                <div><div style="font-size:18px; font-weight:700; color:#FF4D4D;">2</div><div style="font-size:11px; opacity:0.6;">실패</div></div>
              </div>
            </div>
            <div class="ge-item" style="font-size:13px; opacity:0.6; margin-top:20px; animation-delay:1s;">숫자보다 중요한 건, 당신이 내린 선택들입니다</div>
            <button class="ge-item" onclick="document.getElementById('overlay').innerHTML=''" style="margin-top:20px; background:white; color:#191c1e; border:none; border-radius:12px; padding:12px 24px; font-weight:700; animation-delay:1.2s; cursor:pointer;">닫기</button>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
